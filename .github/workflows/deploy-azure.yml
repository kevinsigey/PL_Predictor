# LEGACY. This is NOT the deploy path for PL Predictor.
#
# The authoritative workflow is `.github/workflows/deploy.yml`, which runs on a
# merge to main and deploys to the VPS. This file is workflow_dispatch-only and
# targets Azure Container Apps, which is being cut over to the VPS, so it does
# not run on any push or PR. Do not read this file as "how this repo deploys".
#
# Note that the Azure job you see reported as `skipped` on a normal deploy run
# is the `deploy-azure` job inside `deploy.yml`, not this file.
#
# To see what is actually deployed:
#   gh run list --repo Kevocado/PL_Predictor --workflow deploy.yml -L 5
# See README.md, "Which workflow actually deploys".
name: Deploy to Azure Container Apps

on:
  # Everything runs on the VPS now: this Azure deploy no longer fires on push
  # or PR. Run it by hand from the Actions tab only if Azure is ever needed.
  workflow_dispatch: {}

permissions:
  id-token: write
  contents: read
  packages: write

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Log in to GHCR
        uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4.6.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GHCR_PAT }}

      - name: Build and push image
        run: |
          docker build -t ghcr.io/kevinsigey/pl-predictor:${{ github.sha }} -t ghcr.io/kevinsigey/pl-predictor:latest .
          docker push ghcr.io/kevinsigey/pl-predictor:${{ github.sha }}
          docker push ghcr.io/kevinsigey/pl-predictor:latest

      - name: Log in to Azure
        if: vars.DEPLOY_AZURE != 'false'
        uses: azure/login@7184910d9eb2b1c5e48f7073824a90609bb9b6d6 # v2.3.1
        with:
          client-id: ${{ secrets.AZURE_CLIENT_ID }}
          tenant-id: ${{ secrets.AZURE_TENANT_ID }}
          subscription-id: ${{ secrets.AZURE_SUBSCRIPTION_ID }}

      - name: Deploy new image to Container App
        if: vars.DEPLOY_AZURE != 'false'
        run: |
          az containerapp update \
            --name pl-predictor \
            --resource-group predictor-hub-rg \
            --image ghcr.io/kevinsigey/pl-predictor:${{ github.sha }}

  # Deploys the image built above to the VPS stack (/opt/stack; see the
  # vps-stack README). Switched on by the VPS_HOST repo variable.
  vps:
    needs: deploy
    if: vars.VPS_HOST != ''
    runs-on: ubuntu-latest
    concurrency: vps-deploy-pl
    steps:
      - name: Deploy to VPS
        env:
          SSH_KEY: ${{ secrets.VPS_SSH_KEY }}
          KNOWN_HOSTS: ${{ secrets.VPS_KNOWN_HOSTS }}
        run: |
          install -m 700 -d ~/.ssh
          printf '%s\n' "$SSH_KEY" > ~/.ssh/id_ed25519 && chmod 600 ~/.ssh/id_ed25519
          printf '%s\n' "$KNOWN_HOSTS" > ~/.ssh/known_hosts
          ssh deploy@${{ vars.VPS_HOST }} deploy pl ${{ github.sha }}
